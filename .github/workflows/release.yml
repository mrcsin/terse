name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet test

      - run: dotnet pack -c Release -p:Version=${GITHUB_REF_NAME#v}

      - id: login
        uses: NuGet/login@v1
        with:
          user: mrcsin

      - run: >
          dotnet nuget push Artifacts/package/release/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag Artifacts/package/release/*.nupkg
        env:
          GH_TOKEN: ${{ github.token }}
